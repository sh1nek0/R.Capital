services:
  postgres:
    image: postgres:16-alpine
    container_name: capital-os-postgres
    environment:
      POSTGRES_USER: capital_os
      POSTGRES_PASSWORD: capital_os
      POSTGRES_DB: capital_os_navigator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capital_os -d capital_os_navigator"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: capital-os-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

